name: Full Flutter CI

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
    - "docs/**"
    - "README.md"
  # FP-форк: полная сборка на каждый push в master отключена (релизы собираются по тегу v*,
  # см. flutter-tag.yml). Вернуть — раскомментировать.
  # push:
  #   branches:
  #     - master
  #   paths-ignore:
  #     - ".github/**"
  #     - "docs/**"
  #     - "README.md"
  #     - "res/**"
  #     - "appimage/**"
  #     - "flatpak/**"

jobs:
  run-ci:
    uses: ./.github/workflows/flutter-build.yml
    with:
      upload-artifact: false
