# Бренд сборки — ЕДИНСТВЕННОЕ место, где задаются имя, сервер и ссылки.
# Применяется в CI скриптом branding/apply.py перед сборкой (см. .github/workflows/flutter-build.yml).
# Сменить бренд = поправить значения здесь, закоммитить и выпустить новый тег vX.Y.Z.
# Любое значение можно переопределить переменной окружения BRAND_<ИМЯ> (например BRAND_APP_NAME).
# Формат: КЛЮЧ=значение (без кавычек), # — комментарий.

# Имя приложения: заголовки окон, установщики (MSI/.desktop/Android/macOS), подстановка вместо «RustDesk»
# в переводах. ВНИМАНИЕ: это же имя — каталог настроек (%AppData%\<имя>, ~/.config/<имя>), имя службы Windows
# и каталог установки. Смена имени у уже установленных клиентов = новые настройки (новый ID, пароль).
# Лучше без пробелов (upstream тестирует только буквы/цифры/дефис), но «FP Support» работает с v1.0.x.
APP_NAME=FP Support

# Сервер ID/relay (hbbs/hbbr) и его публичный ключ (id_ed25519.pub сервера)
RENDEZVOUS_SERVER=rustdesk.fp.net.ru
RS_PUB_KEY=NLgR4P35aqUVapGCXZZhz5uzvtmb8jctFQz1C4PZydU=

# Ссылки в интерфейсе
HOMEPAGE_URL=https://f-pos.ru
PRIVACY_URL=https://f-pos.ru
# Исходники сборки (AGPL-3.0): ссылка «Основано на RustDesk» / «О программе»
SOURCE_URL=https://github.com/malike-rnd/rustdesk
# Документация (помощь при проблемах на Linux). Пусто — оставить ссылки на документацию RustDesk.
DOCS_URL=
